# Builds the demo (demo/) and deploys it to GitHub Pages:
# https://luckmorecat.github.io/koi-ascii/
# release.yml calls it after each release, so the demo matches what npm
# installs; run it by hand to redeploy without a release.
name: Pages

on:
  workflow_call:
    inputs:
      version:
        description: Deploy only while no newer version is npm's latest.
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo -- --base /koi-ascii/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checked here, not in release.yml: "Re-run failed jobs" reuses the
      # release job's decision, which a newer release may have outdated.
      - id: fresh
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        # Both are plain x.y.z (only releases deploy), so sort -V orders them.
        # A just-published version may not be npm's latest yet; newer counts.
        run: |
          latest=$(npm view koi-ascii dist-tags.latest)
          if [ "$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $VERSION: npm's latest is now $latest."
          fi
      - id: deployment
        if: inputs.version == '' || steps.fresh.outputs.fresh == 'true'
        uses: actions/deploy-pages@v4
