# Releases package.json's version when it reaches main and isn't released
# yet: publishes it to npm (trusted publishing, so no token; provenance is
# automatic), tags v<version>, creates the GitHub Release from its
# CHANGELOG.md entry, then deploys the demo (pages.yml).
#
# Every step skips what is already done, so after a failure "Re-run jobs"
# finishes the release; scripts/release-notes.ts releasePlan() decides.
# Prereleases (0.4.0-beta.1) go to npm's `next` dist-tag as a GitHub
# prerelease and leave the demo alone. Retrying a version older than its
# channel's completes it without moving `latest`, `next` or the demo back.
#
# npm needs koi-ascii's trusted publisher set to this repo and release.yml
# with direct `npm publish` allowed and no environment (npmjs.com → package
# settings → Trusted publishing). Staged publishing would leave the tag,
# Release and demo ahead of a version npm doesn't serve until approved.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub Release
      id-token: write # npm trusted publishing
    outputs:
      deploy: ${{ steps.state.outputs.deploy }}
      version: ${{ steps.state.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - id: state
        name: Find what is left to do
        run: |
          v=$(node -p "require('./package.json').version")
          export SHA=$GITHUB_SHA ON_NPM=false HAS_RELEASE=false
          [ -n "$(npm view "koi-ascii@$v" version 2>/dev/null)" ] && ON_NPM=true
          # The peeled line (^{}) comes last for an annotated tag.
          TAG_SHA=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | tail -n1 | cut -f1)
          gh release view "v$v" >/dev/null 2>&1 && HAS_RELEASE=true
          DIST_TAGS=$(npm view koi-ascii dist-tags --json)
          export TAG_SHA DIST_TAGS
          node --experimental-strip-types scripts/release-plan.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Check the lockfile and changelog
        run: npm run release:check -- --notes "$RUNNER_TEMP/notes.md"

      - name: Test and publish
        if: steps.state.outputs.publish == 'true'
        run: |
          npm ci
          npm test
          npm publish --tag ${{ steps.state.outputs.distTag }}

      - name: Tag
        if: steps.state.outputs.tag == 'true'
        run: >
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/v${{ steps.state.outputs.version }}" -f sha="$GITHUB_SHA"

      - name: Create the GitHub Release
        if: steps.state.outputs.release == 'true'
        run: >
          gh release create "v${{ steps.state.outputs.version }}" --verify-tag
          --title "v${{ steps.state.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"
          --latest=${{ steps.state.outputs.latest }}
          --prerelease=${{ steps.state.outputs.prerelease }}

  pages:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.release.outputs.version }}
